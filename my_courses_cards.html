
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{background:#e8eaf2;padding:24px 22px 20px;border-radius:20px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.heading{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.card{border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card-top{padding:14px 14px 12px;flex:1;min-height:135px;position:relative;overflow:hidden}
.deco{position:absolute;right:-8px;top:-8px;pointer-events:none;z-index:0}
.badge{display:inline-block;background:rgba(255,255,255,0.88);border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:500;color:#444;position:relative;z-index:2;margin-bottom:12px}
.title{font-size:17px;font-weight:700;color:#1a1a2e;position:relative;z-index:2;margin-bottom:5px;line-height:1.25}
.lessons{font-size:12.5px;color:#2a2a3a;opacity:0.65;position:relative;z-index:2}
.card-btm{background:rgba(255,255,255,0.72);padding:11px 13px;display:flex;align-items:center;gap:10px}
.prog-wrap{flex:1}
.prog-label{font-size:12.5px;font-weight:500;color:#2a2a2a;margin-bottom:6px}
.prog-track{height:4px;background:rgba(0,0,0,0.10);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}
.arr{width:34px;height:34px;border-radius:10px;background:white;border:1.2px solid rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.arr svg{width:14px;height:14px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%}
</style>

<div class="wrap">
  <div class="heading">My Courses</div>
  <div class="grid">

    <!-- CARD 1: Product Design (Purple) -->
    <div class="card" style="background:linear-gradient(145deg,#c8c2f7 0%,#dcd8fb 100%)">
      <div class="card-top">
        <svg class="deco" width="125" height="125" viewBox="0 0 125 125">
          <circle cx="78" cy="28" r="42" fill="white" opacity="0.38"/>
          <circle cx="105" cy="68" r="38" fill="white" opacity="0.38"/>
          <circle cx="55" cy="82" r="32" fill="white" opacity="0.38"/>
        </svg>
        <span class="badge">Design</span>
        <div class="title">Product Design</div>
        <div class="lessons">3/24 lessons</div>
      </div>
      <div class="card-btm">
        <div class="prog-wrap">
          <div class="prog-label">23% completed</div>
          <div class="prog-track"><div class="prog-fill" style="width:23%;background:#7468d0"></div></div>
        </div>
        <div class="arr"><svg viewBox="0 0 14 14" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7.5 4l3.5 3-3.5 3"/></svg></div>
      </div>
    </div>

    <!-- CARD 2: English for IT (Teal) -->
    <div class="card" style="background:linear-gradient(145deg,#62e0c8 0%,#a0f5e6 100%)">
      <div class="card-top">
        <svg class="deco" width="130" height="130" viewBox="0 0 130 130">
          <ellipse cx="88" cy="30" rx="52" ry="40" fill="white" opacity="0.38" transform="rotate(-20 88 30)"/>
          <ellipse cx="72" cy="82" rx="48" ry="36" fill="white" opacity="0.38" transform="rotate(18 72 82)"/>
        </svg>
        <span class="badge">Languages</span>
        <div class="title">English for IT</div>
        <div class="lessons">40/42 lessons</div>
      </div>
      <div class="card-btm">
        <div class="prog-wrap">
          <div class="prog-label">96% completed</div>
          <div class="prog-track"><div class="prog-fill" style="width:96%;background:#1ec8aa"></div></div>
        </div>
        <div class="arr"><svg viewBox="0 0 14 14" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7.5 4l3.5 3-3.5 3"/></svg></div>
      </div>
    </div>

    <!-- CARD 3: App Design (Green) -->
    <div class="card" style="background:linear-gradient(145deg,#96e860 0%,#c8f598 100%)">
      <div class="card-top">
        <svg class="deco" width="130" height="130" viewBox="0 0 130 130">
          <ellipse cx="82" cy="35" rx="55" ry="40" fill="white" opacity="0.38" transform="rotate(10 82 35)"/>
          <ellipse cx="65" cy="85" rx="50" ry="36" fill="white" opacity="0.38" transform="rotate(-8 65 85)"/>
        </svg>
        <span class="badge">Design</span>
        <div class="title">App Design</div>
        <div class="lessons">3/24 lessons</div>
      </div>
      <div class="card-btm">
        <div class="prog-wrap">
          <div class="prog-label">100% completed</div>
          <div class="prog-track"><div class="prog-fill" style="width:100%;background:#52b820"></div></div>
        </div>
        <div class="arr"><svg viewBox="0 0 14 14" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7.5 4l3.5 3-3.5 3"/></svg></div>
      </div>
    </div>

    <!-- CARD 4: Design Management (Pink) -->
    <div class="card" style="background:linear-gradient(145deg,#f5a0b8 0%,#fcc8d5 100%)">
      <div class="card-top">
        <svg class="deco" width="128" height="128" viewBox="0 0 128 128">
          <ellipse cx="95" cy="18" rx="32" ry="18" fill="white" opacity="0.40" transform="rotate(35 95 18)"/>
          <ellipse cx="112" cy="50" rx="30" ry="17" fill="white" opacity="0.40" transform="rotate(70 112 50)"/>
          <ellipse cx="100" cy="82" rx="32" ry="18" fill="white" opacity="0.40" transform="rotate(110 100 82)"/>
          <ellipse cx="72" cy="96" rx="30" ry="17" fill="white" opacity="0.40" transform="rotate(150 72 96)"/>
          <ellipse cx="50" cy="72" rx="28" ry="16" fill="white" opacity="0.40" transform="rotate(190 50 72)"/>
        </svg>
        <span class="badge">Design</span>
        <div class="title">Design Management</div>
        <div class="lessons">2/30 lessons</div>
      </div>
      <div class="card-btm">
        <div class="prog-wrap">
          <div class="prog-label">10% completed</div>
          <div class="prog-track"><div class="prog-fill" style="width:10%;background:#e8607a"></div></div>
        </div>
        <div class="arr"><svg viewBox="0 0 14 14" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7.5 4l3.5 3-3.5 3"/></svg></div>
      </div>
    </div>

  </div>

  <div class="dots">
    <div class="dot" style="background:#1a1a2e"></div>
    <div class="dot" style="background:rgba(0,0,0,0.22)"></div>
    <div class="dot" style="background:rgba(0,0,0,0.22)"></div>
  </div>
</div>
